<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Imposter — Play Online</title>
<style>
  :root {
    --bg: #04070a;
    --bg2: #08160f;
    --card: #0a1c14;
    --card-border: #1f4d33;
    --accent: #ff2f6e;
    --accent2: #8b5cf6;
    --text: #f2fff7;
    --text-dim: #7fa88f;
    --good: #39ff88;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background:
      radial-gradient(1.5px 1.5px at 10% 15%, #ffffff 100%, transparent 100%),
      radial-gradient(1.5px 1.5px at 80% 8%, #ffffff 100%, transparent 100%),
      radial-gradient(1px 1px at 60% 30%, #bff7d6 100%, transparent 100%),
      radial-gradient(1.5px 1.5px at 25% 45%, #ffffff 100%, transparent 100%),
      radial-gradient(1px 1px at 90% 60%, #ffffff 100%, transparent 100%),
      radial-gradient(1.5px 1.5px at 45% 75%, #bff7d6 100%, transparent 100%),
      radial-gradient(1px 1px at 15% 85%, #ffffff 100%, transparent 100%),
      radial-gradient(1.5px 1.5px at 70% 92%, #ffffff 100%, transparent 100%),
      radial-gradient(1px 1px at 95% 35%, #ffffff 100%, transparent 100%),
      radial-gradient(1.5px 1.5px at 35% 5%, #ffffff 100%, transparent 100%),
      radial-gradient(circle at 50% 0%, var(--bg2), var(--bg) 70%);
    background-color: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    justify-content: center;
    padding: 24px 16px 60px;
    user-select: none;
    -webkit-user-select: none;
  }
  #app { width: 100%; max-width: 480px; }

  h1.title {
    text-align: center;
    font-size: 2.2rem;
    letter-spacing: 2px;
    margin: 8px 0 4px;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .subtitle { text-align: center; color: var(--text-dim); margin-bottom: 28px; font-size: 0.95rem; }

  .card {
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 18px;
    padding: 20px;
    margin-bottom: 16px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
  }

  label.field-label {
    display: block;
    font-size: 0.8rem;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--text-dim);
    margin-bottom: 8px;
  }

  input[type=text], select {
    width: 100%;
    padding: 12px;
    border-radius: 12px;
    border: 1px solid var(--card-border);
    background: var(--bg2);
    color: var(--text);
    font-size: 1rem;
    margin-bottom: 16px;
  }
  input::placeholder { color: var(--text-dim); }

  .stepper {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--bg2);
    border-radius: 12px;
    padding: 10px 16px;
    margin-bottom: 16px;
  }
  .stepper button {
    width: 40px; height: 40px;
    border-radius: 10px;
    border: none;
    background: var(--card-border);
    color: var(--text);
    font-size: 1.3rem;
    cursor: pointer;
  }
  .stepper .val { font-size: 1.4rem; font-weight: 600; min-width: 40px; text-align: center; }

  button.primary {
    width: 100%;
    padding: 16px;
    border-radius: 14px;
    border: none;
    background: linear-gradient(90deg, var(--accent), #ff7a5c);
    color: white;
    font-size: 1.1rem;
    font-weight: 700;
    letter-spacing: 0.5px;
    cursor: pointer;
    box-shadow: 0 8px 20px rgba(255,47,110,0.35);
  }
  button.primary:disabled { opacity: 0.4; box-shadow: none; }
  button.primary:active:not(:disabled) { transform: scale(0.98); }

  button.secondary {
    width: 100%;
    padding: 14px;
    border-radius: 14px;
    border: 1px solid var(--card-border);
    background: transparent;
    color: var(--text);
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    margin-top: 10px;
  }

  .tab-row { display: flex; gap: 10px; margin-bottom: 20px; }
  .tab-row button {
    flex: 1;
    padding: 14px;
    border-radius: 14px;
    border: 1px solid var(--card-border);
    background: var(--card);
    color: var(--text-dim);
    font-weight: 700;
    cursor: pointer;
  }
  .tab-row button.active {
    background: linear-gradient(90deg, var(--accent2), #b794f6);
    color: white;
    border-color: transparent;
  }

  .room-code {
    text-align: center;
    font-size: 2.6rem;
    font-weight: 800;
    letter-spacing: 8px;
    margin: 6px 0 4px;
    color: var(--accent2);
  }
  .room-code-hint { text-align: center; color: var(--text-dim); font-size: 0.85rem; margin-bottom: 16px; }

  .player-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 0;
    border-bottom: 1px solid var(--card-border);
  }
  .player-row:last-child { border-bottom: none; }
  .player-row .you { color: var(--text-dim); font-size: 0.8rem; margin-left: 6px; }
  .host-badge {
    padding: 3px 8px;
    border-radius: 20px;
    font-size: 0.7rem;
    font-weight: 700;
    background: rgba(139,92,246,0.2);
    color: var(--accent2);
  }

  .role-card { text-align: center; padding: 30px 20px; }
  .role-word { font-size: 2rem; font-weight: 800; margin: 10px 0; }
  .role-word.imposter { color: var(--accent); }
  .role-word.crew { color: var(--good); }
  .role-caption { color: var(--text-dim); font-size: 0.95rem; }
  .imposter-hint {
    display: inline-block;
    margin: 4px 0 10px;
    padding: 6px 14px;
    border-radius: 20px;
    background: rgba(255,47,110,0.15);
    border: 1px solid var(--accent);
    color: var(--text);
    font-size: 0.9rem;
  }
  .imposter-hint strong { color: var(--accent); }
  .reveal-toggle {
    width: 100%;
    padding: 18px;
    border-radius: 14px;
    border: none;
    background: linear-gradient(135deg, var(--accent2), var(--accent));
    color: white;
    font-size: 1.05rem;
    font-weight: 700;
    cursor: pointer;
  }

  .timer { text-align: center; font-size: 3rem; font-weight: 800; letter-spacing: 2px; margin: 14px 0; }
  .timer-controls { display: flex; gap: 10px; }
  .timer-controls button { flex: 1; }

  .result-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 0;
    border-bottom: 1px solid var(--card-border);
  }
  .result-row:last-child { border-bottom: none; }
  .badge { padding: 4px 10px; border-radius: 20px; font-size: 0.75rem; font-weight: 700; letter-spacing: 0.5px; }
  .badge.imposter { background: rgba(255,47,110,0.2); color: var(--accent); }
  .badge.crew { background: rgba(57,255,136,0.18); color: var(--good); }

  .turn-card { text-align: center; }
  .turn-name { font-size: 1.3rem; font-weight: 700; margin-bottom: 6px; }
  .turn-word { font-size: 2.1rem; font-weight: 800; color: var(--accent2); margin: 8px 0 4px; word-break: break-word; }
  .turn-card input[type=text] { text-align: center; font-size: 1.1rem; }

  .word-reveal { text-align: center; margin-bottom: 16px; }
  .word-reveal .label { color: var(--text-dim); font-size: 0.85rem; text-transform: uppercase; letter-spacing: 1px; }
  .word-reveal .word { font-size: 1.8rem; font-weight: 800; color: var(--accent2); }

  .recap-round { margin-top: 10px; }
  .recap-round:first-of-type { margin-top: 4px; }
  .recap-round-label { font-size: 0.8rem; color: var(--text-dim); font-weight: 700; margin-bottom: 4px; }
  .recap-row {
    display: flex;
    justify-content: space-between;
    padding: 5px 0;
    font-size: 0.9rem;
    border-bottom: 1px solid var(--card-border);
  }
  .recap-row:last-child { border-bottom: none; }
  .recap-row .who { color: var(--accent2); font-weight: 600; }
  .recap-row .correct { color: var(--good); font-weight: 700; }
  .recap-row .wrong { color: var(--accent); font-weight: 700; }

  .suspect-grid {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
  }
  .suspect-btn {
    flex: 1 1 calc(50% - 8px);
    min-width: 110px;
    padding: 14px 10px;
    border-radius: 12px;
    border: 1px solid var(--card-border);
    background: var(--bg2);
    color: var(--text);
    font-size: 1rem;
    font-weight: 700;
    cursor: pointer;
  }
  .suspect-btn:active { transform: scale(0.95); }

  .voting-card-big {
    animation: voting-pulse 1s ease-in-out infinite;
    border-width: 2px;
  }
  @keyframes voting-pulse {
    0%, 100% { box-shadow: 0 0 0px 0px rgba(255,47,110,0.0); border-color: var(--card-border); }
    50% { box-shadow: 0 0 28px 6px rgba(255,47,110,0.55); border-color: var(--accent); }
  }
  .big-countdown {
    font-size: 5.5rem;
    font-weight: 900;
    line-height: 1;
    margin: 10px 0;
    text-align: center;
    background: linear-gradient(90deg, #ff2f6e, #ffb347, #37d67a, #5b8cff, #c94dff, #ff2f6e);
    background-size: 300% 100%;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    animation: countdown-rainbow 1.5s linear infinite, countdown-pop 0.5s ease;
  }
  @keyframes countdown-rainbow {
    0% { background-position: 0% 50%; }
    100% { background-position: 300% 50%; }
  }
  @keyframes countdown-pop {
    0% { transform: scale(0.6); opacity: 0.3; }
    60% { transform: scale(1.15); opacity: 1; }
    100% { transform: scale(1); opacity: 1; }
  }

  .error-banner {
    background: rgba(255,47,110,0.15);
    border: 1px solid var(--accent);
    color: #ffb3ba;
    padding: 12px 14px;
    border-radius: 12px;
    margin-bottom: 16px;
    font-size: 0.9rem;
  }

  .local-link { text-align: center; margin-top: 6px; }
  .local-link a { color: var(--text-dim); font-size: 0.85rem; }

  .leaderboard-card { padding: 16px 18px; }
  .leaderboard-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 0;
    border-bottom: 1px solid var(--card-border);
  }
  .leaderboard-row:last-child { border-bottom: none; }
  .leaderboard-rank { font-weight: 800; color: var(--text-dim); width: 34px; flex-shrink: 0; }
  .leaderboard-row:nth-child(1) .leaderboard-rank { color: var(--good); }
  .leaderboard-row:nth-child(2) .leaderboard-rank { color: var(--accent2); }
  .leaderboard-row:nth-child(3) .leaderboard-rank { color: var(--accent); }
  .leaderboard-name { flex: 1; font-weight: 600; word-break: break-word; }
  .leaderboard-wins { color: var(--good); font-weight: 700; font-size: 0.9rem; white-space: nowrap; }

  .bj-letter-card { padding: 18px 20px; }
  .bj-letter {
    font-size: 4.5rem;
    font-weight: 900;
    letter-spacing: 2px;
    line-height: 1;
    margin: 4px 0 10px;
    background: linear-gradient(90deg, var(--accent2), var(--accent));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .bj-bonus-glow { animation: voting-pulse 1s ease-in-out infinite; border-width: 2px; }

  .bj-category-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 12px;
  }
  .bj-category-row:last-child { margin-bottom: 0; }
  .bj-category-label {
    flex: 0 0 40%;
    font-size: 0.82rem;
    color: var(--text-dim);
    font-weight: 600;
    line-height: 1.2;
  }
  .bj-category-row input[type=text] { margin-bottom: 0; flex: 1; }
  .bj-ghost-tag { color: var(--accent2); font-weight: 700; }
  .bj-allin-btn {
    flex: 0 0 auto;
    width: 40px;
    height: 40px;
    border-radius: 10px;
    border: 1px solid var(--card-border);
    background: var(--bg2);
    font-size: 1.1rem;
    cursor: pointer;
    opacity: 0.55;
  }
  .bj-allin-btn.selected {
    opacity: 1;
    border-color: #ffb347;
    background: rgba(255,179,71,0.18);
    box-shadow: 0 0 10px rgba(255,179,71,0.4);
  }

  .bj-reveal-block { margin-bottom: 16px; }
  .bj-reveal-block:last-child { margin-bottom: 0; }
  .bj-reveal-cat-label {
    font-size: 0.8rem;
    color: var(--text-dim);
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 4px;
  }

  .bj-fireworks-overlay {
    position: fixed;
    inset: 0;
    background: radial-gradient(circle at 50% 40%, rgba(139,92,246,0.25), var(--bg) 75%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 100;
    text-align: center;
    overflow: hidden;
  }
  .bj-fireworks-text {
    font-size: 2.4rem;
    font-weight: 900;
    letter-spacing: 1px;
    background: linear-gradient(90deg, #ff2f6e, #ffb347, #39ff88, #8b5cf6, #ff2f6e);
    background-size: 300% 100%;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    animation: countdown-rainbow 1.5s linear infinite, countdown-pop 0.5s ease;
  }
  .bj-fireworks-sub { margin-top: 10px; font-size: 1.1rem; color: var(--text-dim); font-weight: 600; }
  .bj-firework {
    position: absolute;
    font-size: 2rem;
    animation: bj-firework-pop 1.1s ease-out infinite;
    opacity: 0;
  }
  @keyframes bj-firework-pop {
    0% { transform: scale(0.2); opacity: 0; }
    30% { transform: scale(1.3); opacity: 1; }
    70% { transform: scale(1); opacity: 1; }
    100% { transform: scale(0.8); opacity: 0; }
  }

  .bj-streak-chip {
    display: inline-block;
    margin-left: 4px;
    padding: 2px 8px;
    border-radius: 20px;
    background: rgba(255,179,71,0.18);
    border: 1px solid #ffb347;
    color: #ffb347;
    font-size: 0.75rem;
    font-weight: 700;
    white-space: nowrap;
    animation: bj-firework-pop 0.5s ease;
  }
  .bj-mastermind-banner {
    border-color: var(--accent2);
    color: var(--text);
    font-size: 0.95rem;
  }
  .bj-mastermind-pts { color: var(--good); font-weight: 700; }

  .chat-card { padding: 16px; }
  .chat-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
  }
  .chat-header .field-label { margin-bottom: 0; }
  .chat-messages {
    max-height: 160px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 6px;
    margin-bottom: 12px;
    padding-right: 4px;
  }
  .chat-empty { color: var(--text-dim); font-size: 0.85rem; text-align: center; padding: 10px 0; }
  .chat-msg {
    background: var(--bg2);
    border-radius: 10px;
    padding: 7px 10px;
    font-size: 0.9rem;
    display: flex;
    gap: 6px;
    align-items: baseline;
  }
  .chat-msg .who { font-weight: 700; color: var(--accent2); flex-shrink: 0; }
  .chat-msg .what { color: var(--text); }
  .chat-expressions {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }
  .chat-expressions button {
    flex: 1 1 calc(25% - 8px);
    min-width: 70px;
    padding: 10px 6px;
    border-radius: 10px;
    border: 1px solid var(--card-border);
    background: var(--bg2);
    color: var(--text);
    font-size: 0.85rem;
    font-weight: 600;
    cursor: pointer;
  }
  .chat-expressions button:active { transform: scale(0.95); }
</style>
<div id="app"></div>
<script>
(function () {
  const bjDebounceTimers = {};

  const state = {
    game: localStorage.getItem("active_game") || "imposter", // imposter | brainjam
    view: "home",       // home | lobby | playing | results
    tab: "create",       // create | join
    name: localStorage.getItem("imposter_name") || "",
    joinCode: "",
    customCode: "",
    roomCode: localStorage.getItem("imposter_room") || null,
    playerId: localStorage.getItem("imposter_pid") || null,
    room: null,
    error: null,
    busy: false,
    revealed: false,
    pollHandle: null,
    wordDraft: "",
    showLeaderboard: false,
    leaderboard: [],

    // ---- Brain Jam ----
    bjView: "home",     // home | lobby | playing | reveal | gameover
    bjTab: "create",
    bjName: localStorage.getItem("bj_name") || "",
    bjJoinCode: "",
    bjCustomCodeUnused: "",
    bjRoomCode: localStorage.getItem("bj_room") || null,
    bjPlayerId: localStorage.getItem("bj_pid") || null,
    bjRoom: null,
    bjError: null,
    bjBusy: false,
    bjAnswers: {},        // local draft answers, category -> text
    bjLastBonusKey: null,
    bjShowFireworks: false,
  };

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    }[c]));
  }

  // A short celebratory fanfare for the Brain Jam bonus round, synthesized on
  // the fly with the Web Audio API — no audio file to download or host.
  let bjAudioCtx = null;
  function playFanfare() {
    try {
      bjAudioCtx = bjAudioCtx || new (window.AudioContext || window.webkitAudioContext)();
      const ctx = bjAudioCtx;
      if (ctx.state === "suspended") ctx.resume();
      const notes = [523.25, 659.25, 783.99, 1046.5];
      notes.forEach((freq, i) => {
        const t0 = ctx.currentTime + i * 0.15;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = "triangle";
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.0001, t0);
        gain.gain.exponentialRampToValueAtTime(0.3, t0 + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.35);
        osc.connect(gain).connect(ctx.destination);
        osc.start(t0);
        osc.stop(t0 + 0.4);
      });
    } catch (e) { /* audio unavailable — fireworks still show visually */ }
  }

  async function api(path, method, body) {
    const res = await fetch(path, {
      method,
      headers: body ? { "Content-Type": "application/json" } : undefined,
      body: body ? JSON.stringify(body) : undefined,
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || `Request failed (${res.status})`);
    return data;
  }

  function saveSession() {
    if (state.roomCode) localStorage.setItem("imposter_room", state.roomCode);
    if (state.playerId) localStorage.setItem("imposter_pid", state.playerId);
    if (state.name) localStorage.setItem("imposter_name", state.name);
  }

  function clearSession() {
    localStorage.removeItem("imposter_room");
    localStorage.removeItem("imposter_pid");
    state.roomCode = null;
    state.playerId = null;
    state.room = null;
  }

  function setActiveGame(game) {
    state.game = game;
    localStorage.setItem("active_game", game);
  }

  function bjSaveSession() {
    if (state.bjRoomCode) localStorage.setItem("bj_room", state.bjRoomCode);
    if (state.bjPlayerId) localStorage.setItem("bj_pid", state.bjPlayerId);
    if (state.bjName) localStorage.setItem("bj_name", state.bjName);
  }

  function bjClearSession() {
    localStorage.removeItem("bj_room");
    localStorage.removeItem("bj_pid");
    state.bjRoomCode = null;
    state.bjPlayerId = null;
    state.bjRoom = null;
  }

  function startPolling() {
    stopPolling();
    state.pollHandle = setInterval(() => {
      if (state.game === "brainjam") bjPollRoom(); else pollRoom();
    }, 1500);
  }
  function stopPolling() {
    if (state.pollHandle) { clearInterval(state.pollHandle); state.pollHandle = null; }
  }

  async function pollRoom() {
    if (!state.roomCode || !state.playerId) return;
    try {
      const room = await api(`/api/rooms/${state.roomCode}?playerId=${state.playerId}`, "GET");
      const wasPlaying = state.room && state.room.phase === "playing";
      state.room = room;
      state.error = null;
      if (room.phase === "lobby") state.view = "lobby";
      else if (room.phase === "playing") { state.view = "playing"; if (!wasPlaying) state.revealed = false; }
      else if (room.phase === "results") state.view = "results";

      // If the player is actively typing their word for their own turn, don't blow
      // away the input/focus on this poll cycle — just keep the state fresh silently.
      const active = document.activeElement;
      const isTypingOwnWord = active && active.id === "word-input"
        && room.turnSubPhase === "clues" && room.turn && room.turn.state === "submitting" && room.turn.isYourTurn;
      if (isTypingOwnWord) return;

      render();
    } catch (e) {
      // Room may have expired — drop back to home
      state.error = e.message;
      stopPolling();
      clearSession();
      state.view = "home";
      render();
    }
  }

  async function bjPollRoom() {
    if (!state.bjRoomCode || !state.bjPlayerId) return;
    try {
      const room = await api(`/api/bj/rooms/${state.bjRoomCode}?playerId=${state.bjPlayerId}`, "GET");
      bjHandleNewRoom(room);
      const active = document.activeElement;
      const isTypingAnswer = room.phase === "playing" && active && active.classList && active.classList.contains("bj-answer-input");
      if (isTypingAnswer) return;
      render();
    } catch (e) {
      state.bjError = e.message;
      stopPolling();
      bjClearSession();
      state.bjView = "home";
      render();
    }
  }

  // Shared by poll + every direct bj API call: apply the latest room snapshot,
  // route to the right view, and detect a freshly-triggered bonus round so we
  // can play the fireworks/fanfare moment exactly once.
  function bjHandleNewRoom(room) {
    state.bjRoom = room;
    state.bjError = null;
    if (room.phase === "lobby") state.bjView = "lobby";
    else if (room.phase === "playing") state.bjView = "playing";
    else if (room.phase === "reveal") state.bjView = "reveal";
    else if (room.phase === "gameover") state.bjView = "gameover";

    if (room.phase === "playing") {
      state.bjAnswers = Object.assign({}, room.yourAnswers || {});
    }

    if (room.phase === "playing" && room.roundType === "bonus") {
      const key = `${room.roundType}:${room.roundNumber}:${room.letter}:${(room.categories || []).join("|")}`;
      if (state.bjLastBonusKey !== key) {
        state.bjLastBonusKey = key;
        state.bjShowFireworks = true;
        playFanfare();
        setTimeout(() => { state.bjShowFireworks = false; render(); }, 2600);
      }
    }
  }

  function render() {
    const app = document.getElementById("app");
    if (state.game === "brainjam") {
      app.innerHTML = renderBrainJam();
      attachHandlers();
      return;
    }
    if (state.view === "home") app.innerHTML = renderHome();
    else if (state.view === "lobby") app.innerHTML = renderLobby() + renderChat();
    else if (state.view === "playing") app.innerHTML = renderPlaying() + renderChat();
    else if (state.view === "results") app.innerHTML = renderResults() + renderChat();
    attachHandlers();
    const msgEl = document.getElementById("chat-messages");
    if (msgEl) msgEl.scrollTop = msgEl.scrollHeight;
  }

  function formatTime(sec) {
    sec = Math.max(0, Math.round(sec));
    const m = Math.floor(sec / 60).toString().padStart(2, "0");
    const s = (sec % 60).toString().padStart(2, "0");
    return `${m}:${s}`;
  }

  function renderError() {
    return state.error ? `<div class="error-banner">${escapeHtml(state.error)}</div>` : "";
  }

  function renderChat() {
    const room = state.room;
    if (!room) return "";
    const messages = (room.chat || []).length
      ? room.chat.map(m => `
          <div class="chat-msg">
            <span class="who">${escapeHtml(m.name)}:</span>
            <span class="what">${escapeHtml(m.expression)}</span>
          </div>
        `).join("")
      : `<div class="chat-empty">No messages yet — send a reaction!</div>`;

    const buttons = (room.expressions || []).map(ex => `
      <button data-expression="${escapeHtml(ex)}">${escapeHtml(ex)}</button>
    `).join("");

    return `
      <div class="card chat-card">
        <div class="chat-header"><label class="field-label">Room Chat</label></div>
        <div class="chat-messages" id="chat-messages">${messages}</div>
        <div class="chat-expressions">${buttons}</div>
      </div>
    `;
  }

  function renderLeaderboardRows(list) {
    if (!list || !list.length) {
      return `<div class="subtitle" style="margin-bottom:0;">No imposter wins recorded yet — be the first!</div>`;
    }
    return list.map((e, i) => `
      <div class="leaderboard-row">
        <span class="leaderboard-rank">#${i + 1}</span>
        <span class="leaderboard-name">${escapeHtml(e.name)}</span>
        <span class="leaderboard-wins">${e.wins} ${e.wins === 1 ? "win" : "wins"}</span>
      </div>
    `).join("");
  }

  function renderHome() {
    if (state.showLeaderboard) {
      return `
        <h1 class="title">IMPOSTER</h1>
        <div class="subtitle">🏆 All-Time Imposter Leaderboard</div>
        ${renderError()}
        <div class="card leaderboard-card">
          ${renderLeaderboardRows(state.leaderboard)}
        </div>
        <button class="secondary" id="leaderboard-back-btn">Back</button>
      `;
    }
    return `
      <h1 class="title">IMPOSTER</h1>
      <div class="subtitle">Play online with friends — each on your own phone</div>
      ${renderError()}
      <div class="tab-row">
        <button data-tab="create" class="${state.tab === "create" ? "active" : ""}">Create Game</button>
        <button data-tab="join" class="${state.tab === "join" ? "active" : ""}">Join Game</button>
      </div>
      <div class="card">
        <label class="field-label">Your Name</label>
        <input type="text" id="name-input" placeholder="e.g. Jordan" value="${escapeHtml(state.name)}" maxlength="24" />
        ${state.tab === "join" ? `
          <label class="field-label">Room Code</label>
          <input type="text" id="code-input" placeholder="ABCD" maxlength="8" style="text-transform:uppercase;letter-spacing:4px;text-align:center;font-size:1.3rem;" value="${escapeHtml(state.joinCode)}" />
        ` : `
          <label class="field-label">Room Code (optional)</label>
          <input type="text" id="custom-code-input" placeholder="Leave blank for a random code" maxlength="8" style="text-transform:uppercase;letter-spacing:4px;text-align:center;font-size:1.3rem;" value="${escapeHtml(state.customCode)}" />
        `}
        <button class="primary" id="submit-btn" ${state.busy ? "disabled" : ""}>
          ${state.tab === "create" ? "Create Room" : "Join Room"}
        </button>
      </div>
      <div class="local-link"><a href="/local.html">Just want same-device pass-and-play? Click here</a></div>
      <div class="local-link"><a href="#" id="leaderboard-link">🏆 View All-Time Leaderboard</a></div>
      <div class="local-link"><a href="#" id="switch-to-brainjam-link">🎲 Play Brain Jam instead</a></div>
    `;
  }

  function renderLobby() {
    const room = state.room;
    const players = room.players.map(p => `
      <div class="player-row">
        <span>${escapeHtml(p.name)}${p.isYou ? '<span class="you">(you)</span>' : ""}</span>
        ${p.isHost ? '<span class="host-badge">HOST</span>' : ""}
      </div>
    `).join("");

    const catOptions = room.categories.map(c =>
      `<option value="${escapeHtml(c)}" ${c === room.category ? "selected" : ""}>${escapeHtml(c)}</option>`
    ).join("");

    const hostControls = room.isHost ? `
      <div class="card">
        <label class="field-label">Number of Imposters</label>
        <div class="stepper">
          <button data-action="dec-imposters">−</button>
          <div class="val">${room.numImposters}</div>
          <button data-action="inc-imposters">+</button>
        </div>
        <label class="field-label">Category</label>
        <select id="category-select">${catOptions}</select>
      </div>
      <button class="primary" data-action="start-game" ${room.players.length < 3 ? "disabled" : ""}>
        ${room.players.length < 3 ? "Need at least 3 players" : "Start Game"}
      </button>
    ` : `
      <div class="card">
        <div class="subtitle" style="margin-bottom:0;">Waiting for the host to start the game…</div>
      </div>
    `;

    return `
      <h1 class="title">IMPOSTER</h1>
      ${renderError()}
      <div class="card">
        <div class="room-code">${escapeHtml(room.code)}</div>
        <div class="room-code-hint">Share this code with your friends</div>
        ${players}
      </div>
      ${hostControls}
    `;
  }

  function renderPlaying() {
    const room = state.room;
    const isImposter = room.yourRole === "imposter";

    const roleInner = state.revealed
      ? `
        <div class="role-word ${isImposter ? "imposter" : "crew"}">
          ${isImposter ? "YOU ARE THE IMPOSTER" : escapeHtml(room.yourRole)}
        </div>
        ${isImposter && room.categoryHint ? `<div class="imposter-hint">Category hint: <strong>${escapeHtml(room.categoryHint)}</strong></div>` : ""}
        <div class="role-caption">${isImposter ? "Blend in — don't get caught!" : "Keep it secret from the imposter"}</div>
        <button class="secondary" id="hide-role-btn">Hide</button>
      `
      : `<button class="reveal-toggle" id="reveal-role-btn">Tap to Reveal Your Role</button>`;

    let midSection;
    if (room.turnSubPhase === "clues" && room.turn) {
      midSection = renderTurnCard(room) + renderRoundWordsList(room);
    } else if (room.turnSubPhase === "voting" && room.voting) {
      midSection = renderVotingCard(room);
    } else {
      midSection = `
        <div class="card">
          <div class="subtitle" style="margin-bottom:6px;">Discuss and find the imposter${room.numImposters > 1 ? "s" : ""}!</div>
          <div class="timer" id="game-timer">${formatTime(room.timer.remaining)}</div>
        </div>
      `;
    }

    return `
      <h1 class="title" style="font-size:1.6rem;">YOUR ROLE</h1>
      ${renderError()}
      <div class="card role-card">${roleInner}</div>
      ${midSection}
    `;
  }

  function renderTurnCard(room) {
    const t = room.turn;
    const roundLabel = `Round ${t.round} of ${t.totalRounds}`;

    if (t.state === "revealed" && t.currentWord) {
      const cw = t.currentWord;
      return `
        <div class="card turn-card">
          <div class="subtitle" style="margin-bottom:6px;">${roundLabel}</div>
          <div class="turn-name">${escapeHtml(cw.name)}</div>
          <div class="turn-word">${cw.skipped ? "(no answer — time's up)" : escapeHtml(cw.word)}</div>
        </div>
      `;
    }

    const isYourTurn = t.isYourTurn;
    const body = isYourTurn
      ? `
        <input type="text" id="word-input" placeholder="Type your word" maxlength="40" value="${escapeHtml(state.wordDraft || "")}" autofocus />
        <button class="primary" id="submit-word-btn">Submit Word</button>
      `
      : `<div class="subtitle" style="margin-bottom:0;">Waiting for their word…</div>`;

    return `
      <div class="card turn-card">
        <div class="subtitle" style="margin-bottom:6px;">${roundLabel}</div>
        <div class="turn-name">${isYourTurn ? "Your turn!" : escapeHtml(t.currentPlayerName) + "'s turn"}</div>
        <div class="timer" id="turn-timer">${formatTime(t.remaining)}</div>
        ${body}
      </div>
    `;
  }

  function renderVotingCard(room) {
    const v = room.voting;
    const remaining = room.timer.remaining;
    const bigMode = remaining <= 10 && room.timer.status === "running";
    const suspects = (v.suspects || []).filter(p => !p.isYou);

    const timerHtml = bigMode
      ? `<div class="big-countdown" id="game-timer">${Math.max(0, Math.round(remaining))}</div>`
      : `<div class="timer" id="game-timer">${formatTime(remaining)}</div>`;

    let body;
    if (v.yourGuess) {
      const guessedPlayer = (v.suspects || []).find(p => p.id === v.yourGuess);
      body = `
        <div class="subtitle" style="margin-bottom:0;">
          You guessed <strong>${escapeHtml(guessedPlayer ? guessedPlayer.name : "someone")}</strong> — locked in!
          (${v.lockedCount}/${v.totalPlayers} locked in)
        </div>
      `;
    } else {
      body = `
        <div class="subtitle" style="margin-bottom:10px;">Who's the imposter? Tap to lock your guess.</div>
        <div class="suspect-grid">
          ${suspects.map(p => `<button class="secondary suspect-btn" data-guess="${escapeHtml(p.id)}">${escapeHtml(p.name)}</button>`).join("")}
        </div>
        <div class="subtitle" style="margin-top:10px;margin-bottom:0;">${v.lockedCount}/${v.totalPlayers} locked in</div>
      `;
    }

    return `
      <div class="card ${bigMode ? "voting-card-big" : ""}" style="text-align:center;">
        <div class="subtitle" style="margin-bottom:6px;">Lock In Your Guess</div>
        ${timerHtml}
        ${body}
      </div>
    `;
  }

  function renderRoundWordsList(room) {
    const t = room.turn;
    const roundWords = (t.words || []).filter(w => w.round === t.round);
    if (!roundWords.length) return "";
    const rows = roundWords.map(w => `
      <div class="recap-row">
        <span class="who">${escapeHtml(w.name)}</span>
        <span class="what">${w.word ? escapeHtml(w.word) : "(no answer)"}</span>
      </div>
    `).join("");
    return `
      <div class="card">
        <label class="field-label">This Round's Words</label>
        ${rows}
      </div>
    `;
  }

  function renderResults() {
    const room = state.room;
    const rows = room.results.map(p => `
      <div class="result-row">
        <span>${escapeHtml(p.name)}</span>
        <span class="badge ${p.isImposter ? "imposter" : "crew"}">${p.isImposter ? "IMPOSTER" : "CREW"}</span>
      </div>
    `).join("");

    const hostControls = room.isHost ? `
      <button class="primary" data-action="play-again">Play Again (Same Players)</button>
      <button class="secondary" data-action="new-lobby">Back to Lobby</button>
    ` : `<div class="subtitle">Waiting for the host to start another round…</div>`;

    const history = room.turnHistory || [];
    let recap = "";
    if (history.length) {
      const byRound = {};
      history.forEach(h => { (byRound[h.round] = byRound[h.round] || []).push(h); });
      const roundBlocks = Object.keys(byRound).sort((a, b) => a - b).map(r => `
        <div class="recap-round">
          <div class="recap-round-label">Round ${escapeHtml(r)}</div>
          ${byRound[r].map(h => `
            <div class="recap-row">
              <span class="who">${escapeHtml(h.name)}</span>
              <span class="what">${h.word ? escapeHtml(h.word) : "(no answer)"}</span>
            </div>
          `).join("")}
        </div>
      `).join("");
      recap = `<div class="card"><label class="field-label">Words Given</label>${roundBlocks}</div>`;
    }

    const votes = room.votes || [];
    let votesRecap = "";
    if (votes.length) {
      const voteRows = votes.map(v => `
        <div class="recap-row">
          <span class="who">${escapeHtml(v.name)}</span>
          <span class="what">
            guessed ${v.guessName ? escapeHtml(v.guessName) : "no one"}
            <span class="${v.correct ? "correct" : "wrong"}">${v.correct ? "✓" : "✗"}</span>
          </span>
        </div>
      `).join("");
      votesRecap = `<div class="card"><label class="field-label">Who Guessed What</label>${voteRows}</div>`;
    }

    const leaderboardCard = `
      <div class="card leaderboard-card">
        <label class="field-label">🏆 All-Time Leaderboard</label>
        ${renderLeaderboardRows(room.leaderboard)}
      </div>
    `;

    return `
      ${renderError()}
      <div class="card">
        <div class="word-reveal">
          <div class="label">The secret word was</div>
          <div class="word">${escapeHtml(room.word)}</div>
        </div>
        ${rows}
      </div>
      ${votesRecap}
      ${recap}
      ${leaderboardCard}
      ${hostControls}
    `;
  }

  // ==================== Brain Jam ====================

  function bjRenderError() {
    return state.bjError ? `<div class="error-banner">${escapeHtml(state.bjError)}</div>` : "";
  }

  function renderBrainJam() {
    if (state.bjView === "lobby" && state.bjRoom) return bjRenderLobby();
    if (state.bjView === "playing" && state.bjRoom) return bjRenderPlaying();
    if (state.bjView === "reveal" && state.bjRoom) return bjRenderReveal();
    if (state.bjView === "gameover" && state.bjRoom) return bjRenderGameover();
    return bjRenderHome();
  }

  function bjRenderHome() {
    return `
      <h1 class="title">BRAIN JAM</h1>
      <div class="subtitle">Scattergories-style word game — one letter, race the clock</div>
      ${bjRenderError()}
      <div class="tab-row">
        <button data-bjtab="create" class="${state.bjTab === "create" ? "active" : ""}">Create Game</button>
        <button data-bjtab="join" class="${state.bjTab === "join" ? "active" : ""}">Join Game</button>
      </div>
      <div class="card">
        <label class="field-label">Your Name</label>
        <input type="text" id="bj-name-input" placeholder="e.g. Jordan" value="${escapeHtml(state.bjName)}" maxlength="24" />
        ${state.bjTab === "join" ? `
          <label class="field-label">Room Code</label>
          <input type="text" id="bj-code-input" placeholder="ABCD" maxlength="8" style="text-transform:uppercase;letter-spacing:4px;text-align:center;font-size:1.3rem;" value="${escapeHtml(state.bjJoinCode)}" />
        ` : ""}
        <button class="primary" id="bj-submit-btn" ${state.bjBusy ? "disabled" : ""}>
          ${state.bjTab === "create" ? "Create Room" : "Join Room"}
        </button>
      </div>
      <div class="local-link"><a href="#" id="switch-to-imposter-link">🕵️ Play Imposter instead</a></div>
    `;
  }

  function bjRenderLobby() {
    const room = state.bjRoom;
    const players = room.players.map(p => `
      <div class="player-row">
        <span>${escapeHtml(p.name)}${p.id === room.youId ? '<span class="you">(you)</span>' : ""}</span>
        ${p.isHost ? '<span class="host-badge">HOST</span>' : ""}
      </div>
    `).join("");

    const hostControls = room.isHost ? `
      <button class="primary" data-action="bj-start-game" ${room.players.length < 2 ? "disabled" : ""}>
        ${room.players.length < 2 ? "Need at least 2 players" : "Start Game"}
      </button>
    ` : `
      <div class="card"><div class="subtitle" style="margin-bottom:0;">Waiting for the host to start the game…</div></div>
    `;

    return `
      <h1 class="title">BRAIN JAM</h1>
      ${bjRenderError()}
      <div class="card">
        <div class="room-code">${escapeHtml(room.code)}</div>
        <div class="room-code-hint">Share this code with your friends</div>
        ${players}
      </div>
      <div class="card">
        <div class="subtitle" style="margin-bottom:0;">3 rounds • one shared letter + 12 categories • 90 seconds • duplicate answers cancel out • chain valid answers for 🦃 Turkey / 🐙 Octopus / 👁️ Sixth Sense • 🏝️ Sole Survivor for a category nobody else answered • 📏 Big Word for 10+ letters • zero duplicates all round earns 🧠 Mastermind • sweep every category for 🎯 +5 • 🎰 go All In on one category to double it (or lose 2 if it busts) • 👻 haunted categories pay double next time • a total whiff refunds the next category • watch for a surprise bonus round!</div>
      </div>
      ${hostControls}
    `;
  }

  function bjRenderFireworksOverlay() {
    const room = state.bjRoom;
    const emojis = ["🎆", "🎇", "✨", "💥"];
    const bursts = Array.from({ length: 12 }, (_, i) => {
      const left = Math.round(Math.random() * 88 + 4);
      const top = Math.round(Math.random() * 55 + 5);
      const delay = (Math.random() * 0.7).toFixed(2);
      return `<span class="bj-firework" style="left:${left}%;top:${top}%;animation-delay:${delay}s;">${emojis[i % emojis.length]}</span>`;
    }).join("");
    return `
      <div class="bj-fireworks-overlay">
        ${bursts}
        <div class="bj-fireworks-text">✨ BONUS ROUND ✨</div>
        <div class="bj-fireworks-sub">${escapeHtml(room.bonusCategoryLabel || "")}</div>
      </div>
    `;
  }

  function bjRenderPlaying() {
    const room = state.bjRoom;
    if (state.bjShowFireworks) return bjRenderFireworksOverlay();

    const isBonus = room.roundType === "bonus";
    const remaining = room.timer.remaining;
    const bigMode = remaining <= 10 && room.timer.status === "running";
    const timerHtml = bigMode
      ? `<div class="big-countdown" id="bj-timer">${Math.max(0, Math.round(remaining))}</div>`
      : `<div class="timer" id="bj-timer">${formatTime(remaining)}</div>`;

    const headerLabel = isBonus
      ? `BONUS ROUND — ${escapeHtml(room.bonusCategoryLabel)}`
      : `Round ${room.roundNumber} of ${room.totalRounds}`;

    const ghostCategories = room.ghostCategories || [];
    const rows = room.categories.map((cat, i) => {
      const label = isBonus ? `${i + 1}.` : escapeHtml(cat);
      const value = escapeHtml(state.bjAnswers[cat] || "");
      const isGhost = ghostCategories.includes(cat);
      const isAllIn = room.yourAllIn === cat;
      return `
        <div class="bj-category-row">
          <label class="bj-category-label">${label}${isGhost ? ' <span class="bj-ghost-tag">👻 2x</span>' : ""}</label>
          <input type="text" class="bj-answer-input" data-category="${escapeHtml(cat)}" value="${value}" maxlength="60"
            ${room.youLocked ? "disabled" : ""} placeholder="Starts with ${escapeHtml(room.letter)}…" />
          <button type="button" class="bj-allin-btn ${isAllIn ? "selected" : ""}" data-allin-category="${escapeHtml(cat)}"
            ${room.youLocked ? "disabled" : ""} title="Go All In on this category">🎰</button>
        </div>
      `;
    }).join("");

    const remainingPlayers = room.totalPlayers - room.lockedCount;
    const lockControl = room.youLocked
      ? `<div class="subtitle" style="margin-bottom:0;">Locked in! ${remainingPlayers === 0 ? "Everyone's in…" : `Waiting on ${remainingPlayers} more…`} (${room.lockedCount}/${room.totalPlayers})</div>`
      : `<button class="primary" id="bj-lockin-btn">Lock In My Answers</button>
         <div class="subtitle" style="margin-top:8px;margin-bottom:0;">${room.lockedCount}/${room.totalPlayers} locked in</div>`;

    return `
      <h1 class="title" style="font-size:1.6rem;">${isBonus ? "BONUS ROUND" : "BRAIN JAM"}</h1>
      ${bjRenderError()}
      <div class="card bj-letter-card ${isBonus ? "bj-bonus-glow" : ""}" style="text-align:center;">
        <div class="subtitle" style="margin-bottom:4px;">${headerLabel}</div>
        <div class="bj-letter">${escapeHtml(room.letter)}</div>
        ${timerHtml}
      </div>
      <div class="card">
        ${rows}
        <div class="subtitle" style="margin:10px 0 0;">🎰 Tap the dice on one category to go All In — doubles if it scores, costs 2 if it busts.</div>
      </div>
      <div class="card" style="text-align:center;">${lockControl}</div>
    `;
  }

  const BJ_STREAK_EMOJI = {
    "Turkey": "🦃", "Octopus": "🐙", "Sixth Sense": "👁️", "Sole Survivor": "🏝️",
    "Big Word": "📏", "All In": "🎰", "All In (busted)": "💥", "Ghost Town": "👻", "Miss Refund": "🔁",
  };

  function bjRenderReveal() {
    const room = state.bjRoom;
    const rr = room.roundResults;
    const isBonus = room.roundType === "bonus";

    const categoryBlocks = rr.breakdown.map((block, i) => {
      const label = isBonus ? `Line ${i + 1}` : escapeHtml(block.category);
      const entryRows = block.entries.map(e => {
        const cls = e.canceled ? "wrong" : (e.valid ? "correct" : "wrong");
        const status = e.canceled ? "Canceled (dup)" : (e.valid ? `+${e.points}` : (e.answer ? "Invalid" : "No answer"));
        const streakChip = (e.badges || []).map(b => {
          const sign = b.points >= 0 ? "+" : "";
          return ` <span class="bj-streak-chip">${BJ_STREAK_EMOJI[b.label] || "⭐"} ${escapeHtml(b.label)} ${sign}${b.points}</span>`;
        }).join("");
        return `
          <div class="recap-row">
            <span class="who">${escapeHtml(e.name)}</span>
            <span class="what">${e.answer ? escapeHtml(e.answer) : "—"} <span class="${cls}">${status}</span>${streakChip}</span>
          </div>
        `;
      }).join("");
      return `<div class="bj-reveal-block"><div class="bj-reveal-cat-label">${label}</div>${entryRows}</div>`;
    }).join("");

    const scoreRows = room.players.slice().sort((a, b) => b.score - a.score).map(p => `
      <div class="result-row">
        <span>${escapeHtml(p.name)}</span>
        <span class="badge crew">${p.score} pts</span>
      </div>
    `).join("");

    const mastermindBanner = (rr.mastermindNames && rr.mastermindNames.length)
      ? `<div class="card bj-mastermind-banner" style="text-align:center;">🧠 <strong>Mastermind</strong> — no duplicates all round: ${rr.mastermindNames.map(escapeHtml).join(", ")} <span class="bj-mastermind-pts">+1</span></div>`
      : "";
    const categorySweepBanner = (rr.categorySweepNames && rr.categorySweepNames.length)
      ? `<div class="card bj-mastermind-banner" style="text-align:center;">🎯 <strong>Category Sweep</strong> — scored on every category: ${rr.categorySweepNames.map(escapeHtml).join(", ")} <span class="bj-mastermind-pts">+5</span></div>`
      : "";

    const hostControls = room.isHost
      ? `<button class="primary" data-action="bj-next-round">Continue</button>`
      : `<div class="subtitle">Waiting for the host to continue…</div>`;

    return `
      <h1 class="title" style="font-size:1.6rem;">${isBonus ? "BONUS ROUND RESULTS" : "ROUND RESULTS"}</h1>
      ${bjRenderError()}
      <div class="card">
        <label class="field-label">Scores</label>
        ${scoreRows}
      </div>
      ${mastermindBanner}
      ${categorySweepBanner}
      <div class="card">${categoryBlocks}</div>
      ${hostControls}
    `;
  }

  function bjRenderGameover() {
    const room = state.bjRoom;
    const ranked = room.finalScores;
    const rows = ranked.map((p, i) => `
      <div class="result-row">
        <span>${i === 0 ? "🏆 " : ""}${escapeHtml(p.name)}</span>
        <span class="badge crew">${p.score} pts</span>
      </div>
    `).join("");

    const hostControls = room.isHost ? `
      <button class="primary" data-action="bj-play-again">Play Again (Same Players)</button>
      <button class="secondary" data-action="bj-new-lobby">Back to Lobby</button>
    ` : `<div class="subtitle">Waiting for the host to start another game…</div>`;

    return `
      <h1 class="title">GAME OVER</h1>
      ${bjRenderError()}
      <div class="card">${rows}</div>
      ${hostControls}
    `;
  }

  function attachHandlers() {
    const app = document.getElementById("app");
    const click = (sel, fn) => { const el = app.querySelector(sel); if (el) el.addEventListener("click", fn); };

    app.querySelectorAll("[data-tab]").forEach(btn => {
      btn.addEventListener("click", () => { state.tab = btn.getAttribute("data-tab"); render(); });
    });

    click("#leaderboard-link", async (e) => {
      e.preventDefault();
      state.error = null;
      state.showLeaderboard = true;
      render();
      try {
        const data = await api("/api/leaderboard", "GET");
        state.leaderboard = data.leaderboard || [];
      } catch (err) {
        state.error = err.message;
      }
      render();
    });
    click("#leaderboard-back-btn", () => {
      state.showLeaderboard = false;
      state.error = null;
      render();
    });

    const nameInput = document.getElementById("name-input");
    if (nameInput) nameInput.addEventListener("input", e => { state.name = e.target.value; });
    const codeInput = document.getElementById("code-input");
    if (codeInput) codeInput.addEventListener("input", e => { state.joinCode = e.target.value.toUpperCase(); });
    const customCodeInput = document.getElementById("custom-code-input");
    if (customCodeInput) customCodeInput.addEventListener("input", e => { state.customCode = e.target.value.toUpperCase(); });

    click("#submit-btn", async () => {
      state.error = null;
      const name = (state.name || "").trim();
      if (!name) { state.error = "Enter your name first."; render(); return; }
      state.busy = true; render();
      try {
        let room;
        if (state.tab === "create") {
          const code = (state.customCode || "").trim().toUpperCase();
          room = await api("/api/rooms", "POST", code ? { name, code } : { name });
        } else {
          const code = (state.joinCode || "").trim().toUpperCase();
          if (code.length < 3) throw new Error("Enter the room code.");
          room = await api(`/api/rooms/${code}/join`, "POST", { name });
        }
        state.playerId = room.playerId;
        state.roomCode = room.code;
        saveSession();
        state.room = room;
        state.view = room.phase === "lobby" ? "lobby" : room.phase;
        state.busy = false;
        render();
        startPolling();
      } catch (e) {
        state.busy = false;
        state.error = e.message;
        render();
      }
    });

    click('[data-action="inc-imposters"]', async () => {
      const n = Math.min(3, state.room.numImposters + 1);
      await safeApi(`/api/rooms/${state.roomCode}/settings`, { playerId: state.playerId, numImposters: n });
    });
    click('[data-action="dec-imposters"]', async () => {
      const n = Math.max(1, state.room.numImposters - 1);
      await safeApi(`/api/rooms/${state.roomCode}/settings`, { playerId: state.playerId, numImposters: n });
    });
    const catSelect = document.getElementById("category-select");
    if (catSelect) catSelect.addEventListener("change", async e => {
      await safeApi(`/api/rooms/${state.roomCode}/settings`, { playerId: state.playerId, category: e.target.value });
    });

    click('[data-action="start-game"]', async () => {
      await safeApi(`/api/rooms/${state.roomCode}/start`, { playerId: state.playerId });
    });

    click("#reveal-role-btn", () => { state.revealed = true; render(); });
    click("#hide-role-btn", () => { state.revealed = false; render(); });

    click('[data-action="timer-toggle"]', async () => {
      const action = state.room.timer.status === "running" ? "pause" : "start";
      await safeApi(`/api/rooms/${state.roomCode}/timer`, { playerId: state.playerId, action });
    });
    click('[data-action="timer-reset"]', async () => {
      await safeApi(`/api/rooms/${state.roomCode}/timer`, { playerId: state.playerId, action: "reset" });
    });

    click('[data-action="show-results"]', async () => {
      await safeApi(`/api/rooms/${state.roomCode}/reveal`, { playerId: state.playerId });
    });

    const wordInput = document.getElementById("word-input");
    if (wordInput) {
      wordInput.addEventListener("input", e => { state.wordDraft = e.target.value; });
      wordInput.addEventListener("keydown", e => {
        if (e.key === "Enter") { e.preventDefault(); document.getElementById("submit-word-btn").click(); }
      });
    }
    click("#submit-word-btn", async () => {
      const word = (state.wordDraft || "").trim();
      if (!word) { state.error = "Type a word first."; render(); return; }
      state.wordDraft = "";
      await safeApi(`/api/rooms/${state.roomCode}/turn/submit`, { playerId: state.playerId, word });
    });
    click('[data-action="play-again"]', async () => {
      await safeApi(`/api/rooms/${state.roomCode}/again`, { playerId: state.playerId });
    });
    click('[data-action="new-lobby"]', async () => {
      await safeApi(`/api/rooms/${state.roomCode}/lobby`, { playerId: state.playerId });
    });

    app.querySelectorAll("[data-expression]").forEach(btn => {
      btn.addEventListener("click", async () => {
        const expression = btn.getAttribute("data-expression");
        await safeApi(`/api/rooms/${state.roomCode}/chat`, { playerId: state.playerId, expression });
      });
    });

    app.querySelectorAll("[data-guess]").forEach(btn => {
      btn.addEventListener("click", async () => {
        const guessId = btn.getAttribute("data-guess");
        await safeApi(`/api/rooms/${state.roomCode}/vote`, { playerId: state.playerId, guessId });
      });
    });

    // ---- Brain Jam ----
    click("#switch-to-brainjam-link", (e) => {
      e.preventDefault();
      setActiveGame("brainjam");
      render();
      if (state.bjRoomCode && state.bjPlayerId && !state.bjRoom) bjInit();
    });
    click("#switch-to-imposter-link", (e) => {
      e.preventDefault();
      setActiveGame("imposter");
      render();
    });

    app.querySelectorAll("[data-bjtab]").forEach(btn => {
      btn.addEventListener("click", () => { state.bjTab = btn.getAttribute("data-bjtab"); render(); });
    });

    const bjNameInput = document.getElementById("bj-name-input");
    if (bjNameInput) bjNameInput.addEventListener("input", e => { state.bjName = e.target.value; });
    const bjCodeInput = document.getElementById("bj-code-input");
    if (bjCodeInput) bjCodeInput.addEventListener("input", e => { state.bjJoinCode = e.target.value.toUpperCase(); });

    click("#bj-submit-btn", async () => {
      state.bjError = null;
      const name = (state.bjName || "").trim();
      if (!name) { state.bjError = "Enter your name first."; render(); return; }
      state.bjBusy = true; render();
      try {
        let room;
        if (state.bjTab === "create") {
          room = await api("/api/bj/rooms", "POST", { name });
        } else {
          const code = (state.bjJoinCode || "").trim().toUpperCase();
          if (code.length < 3) throw new Error("Enter the room code.");
          room = await api(`/api/bj/rooms/${code}/join`, "POST", { name });
        }
        state.bjPlayerId = room.playerId;
        state.bjRoomCode = room.code;
        bjSaveSession();
        bjHandleNewRoom(room);
        state.bjBusy = false;
        render();
        startPolling();
      } catch (e) {
        state.bjBusy = false;
        state.bjError = e.message;
        render();
      }
    });

    click('[data-action="bj-start-game"]', async () => {
      await bjSafeApi(`/api/bj/rooms/${state.bjRoomCode}/start`, { playerId: state.bjPlayerId });
    });

    app.querySelectorAll(".bj-answer-input").forEach(inp => {
      inp.addEventListener("input", (e) => {
        const cat = inp.getAttribute("data-category");
        state.bjAnswers[cat] = e.target.value;
        clearTimeout(bjDebounceTimers[cat]);
        bjDebounceTimers[cat] = setTimeout(async () => {
          try {
            await api(`/api/bj/rooms/${state.bjRoomCode}/answer`, "POST", { playerId: state.bjPlayerId, category: cat, text: e.target.value });
          } catch (err) { /* best effort — next poll resyncs anyway */ }
        }, 400);
      });
    });
    app.querySelectorAll(".bj-allin-btn").forEach(btn => {
      btn.addEventListener("click", async () => {
        const cat = btn.getAttribute("data-allin-category");
        const alreadySelected = state.bjRoom && state.bjRoom.yourAllIn === cat;
        const category = alreadySelected ? "" : cat;
        await bjSafeApi(`/api/bj/rooms/${state.bjRoomCode}/allin`, { playerId: state.bjPlayerId, category });
      });
    });
    click("#bj-lockin-btn", async () => {
      await bjSafeApi(`/api/bj/rooms/${state.bjRoomCode}/lockin`, { playerId: state.bjPlayerId });
    });
    click('[data-action="bj-next-round"]', async () => {
      await bjSafeApi(`/api/bj/rooms/${state.bjRoomCode}/next`, { playerId: state.bjPlayerId });
    });
    click('[data-action="bj-play-again"]', async () => {
      await bjSafeApi(`/api/bj/rooms/${state.bjRoomCode}/again`, { playerId: state.bjPlayerId });
    });
    click('[data-action="bj-new-lobby"]', async () => {
      await bjSafeApi(`/api/bj/rooms/${state.bjRoomCode}/lobby`, { playerId: state.bjPlayerId });
    });
  }

  async function bjSafeApi(path, body) {
    try {
      const room = await api(path, "POST", body);
      bjHandleNewRoom(room);
      render();
    } catch (e) {
      state.bjError = e.message;
      render();
    }
  }

  async function safeApi(path, body) {
    try {
      const room = await api(path, "POST", body);
      state.room = room;
      state.error = null;
      if (room.phase === "lobby") state.view = "lobby";
      else if (room.phase === "playing") state.view = "playing";
      else if (room.phase === "results") state.view = "results";
      render();
    } catch (e) {
      state.error = e.message;
      render();
    }
  }

  // Local timer ticking between polls, for smoothness.
  // Updates timer text directly (no full render()) so it never disrupts
  // someone actively typing their word into #word-input.
  setInterval(() => {
    const room = state.room;
    if (!room || state.view !== "playing") return;
    if (room.timer && room.timer.status === "running" && room.timer.remaining > 0) {
      const before = room.timer.remaining;
      room.timer.remaining = Math.max(0, room.timer.remaining - 1);
      const after = room.timer.remaining;
      // During the vote-lock countdown, the display flips into a big colorful
      // mode at exactly 10s left, and needs to keep re-rendering every second
      // while in that mode so the rainbow/pop animation replays each tick.
      if (room.turnSubPhase === "voting") {
        if (after <= 10 || before <= 10) { render(); return; }
      }
      const el = document.getElementById("game-timer");
      if (el) el.textContent = formatTime(room.timer.remaining);
    }
    if (room.turnSubPhase === "clues" && room.turn && room.turn.state === "submitting" && room.turn.remaining > 0) {
      room.turn.remaining = Math.max(0, room.turn.remaining - 1);
      const el = document.getElementById("turn-timer");
      if (el) el.textContent = formatTime(room.turn.remaining);
    }
  }, 1000);

  // Same local ticking treatment for Brain Jam's round timer.
  setInterval(() => {
    if (state.game !== "brainjam") return;
    const room = state.bjRoom;
    if (!room || state.bjView !== "playing" || state.bjShowFireworks) return;
    if (room.timer && room.timer.status === "running" && room.timer.remaining > 0) {
      const before = room.timer.remaining;
      room.timer.remaining = Math.max(0, room.timer.remaining - 1);
      const after = room.timer.remaining;
      if (after <= 10 || before <= 10) { render(); return; }
      const el = document.getElementById("bj-timer");
      if (el) el.textContent = formatTime(room.timer.remaining);
    }
  }, 1000);

  // Rejoin an existing session on load, if we have one saved
  async function bjInit() {
    if (state.bjRoomCode && state.bjPlayerId) {
      try {
        const room = await api(`/api/bj/rooms/${state.bjRoomCode}?playerId=${state.bjPlayerId}`, "GET");
        bjHandleNewRoom(room);
        render();
        startPolling();
        return;
      } catch (e) {
        bjClearSession();
      }
    }
    render();
  }

  async function init() {
    if (state.game === "brainjam") {
      await bjInit();
      return;
    }
    if (state.roomCode && state.playerId) {
      try {
        const room = await api(`/api/rooms/${state.roomCode}?playerId=${state.playerId}`, "GET");
        state.room = room;
        state.view = room.phase === "lobby" ? "lobby" : room.phase;
        render();
        startPolling();
        return;
      } catch (e) {
        clearSession();
      }
    }
    render();
  }

  init();
})();
</script>
